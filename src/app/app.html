<div class="mx-auto w-[1071px] min-h-screen flex flex-col">

    <header class="flex justify-between p-4">
        <img class="h-8" src="./assets/logo.png" alt="logo">

        <button id="add-button"
                type="button"
                data-modal-target="default-modal"
                data-modal-toggle="default-modal"
                class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 flex items-center">
            <img class="w-4 h-4" src="./assets/add-icon.png" alt="add-icon">
            Добавить
        </button>
    </header>

    <main class="relative overflow-x-auto flex-1">
        <table id="contragents-table" class="w-full text-left rtl:text-right">
            <thead class="uppercase font-bold text-xs bg-gray-50 text-gray-700">
            <tr>
                <th scope="col" class="px-6 py-3">
                    Наименование
                </th>
                <th scope="col" class="px-6 py-3">
                    ИНН
                </th>
                <th scope="col" class="px-6 py-3">
                    Адрес
                </th>
                <th scope="col" class="px-6 py-3">
                    КПП
                </th>
                <th scope="col" class="px-6 py-3">

                </th>
            </tr>
            </thead>

            <tbody></tbody>
        </table>
    </main>

    <footer class="py-4 text-gray-500 text-center">
        © 2007-2024 ООО "Логнекс"
    </footer>

</div>

<div id="default-modal" tabindex="-1" aria-hidden="true"
     class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative w-full max-w-[26rem] max-h-full">
        <div class="relative bg-white border rounded-lg">
            <div class="flex items-center justify-between border-b px-5 py-3">
                <h3 class="text-xl font-semibold">
                    Контрагент
                </h3>
                <button type="button"
                        id="close-modal-button"
                        data-modal-hide="default-modal">
                    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 1L6.14286 6.14286M6.14286 6.14286L11.2857 11.2857M6.14286 6.14286L11.2857 1M6.14286 6.14286L1 11.2857"
                              stroke="#9CA3AF" stroke-width="1.71429" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <div class="px-5 pb-5">
                <div class="pt-5">
                    <label for="name" class="block mb-2.5 text-sm font-medium text-heading">Наименование</label>
                    <input type="text"
                           id="name"
                           class="bg-gray-50 border border-gray-300 text-sm text-gray-500 rounded-lg w-full"
                           required/>
                </div>
                <div class="pt-5">
                    <label for="inn" class="block mb-2.5 text-sm font-medium text-heading">ИНН</label>
                    <input type="text"
                           id="inn"
                           class="bg-gray-50 border border-gray-300 text-sm text-gray-500 rounded-lg w-full"
                           required/>
                </div>
                <div class="pt-5">
                    <label for="address" class="block mb-2.5 text-sm font-medium text-heading">Адрес</label>
                    <input type="text"
                           id="address"
                           class="bg-gray-50 border border-gray-300 text-sm text-gray-500 rounded-lg w-full"
                           required/>
                </div>
                <div class="pt-5">
                    <label for="kpp" class="block mb-2.5 text-sm font-medium text-heading">КПП</label>
                    <input type="text"
                           id="kpp"
                           class="bg-gray-50 border border-gray-300 text-sm text-gray-500 rounded-lg w-full"
                           required/>
                </div>
                <div class="pt-4">
                    <button type="button"
                            id="save-modal-button"
                            class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2">
                        Сохранить
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
